name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pytest
      - name: Sync upstream tools
        run: python -m jev_pipeline tools-sync
      - name: Test
        run: python -m pytest tests/ -q

  plugin-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm (runner npm 10.9 consistently hits the 'Exit handler never called' bug on this dependency tree)
        run: corepack enable && corepack prepare pnpm@latest --activate
      - name: Install
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build
        run: pnpm run build
