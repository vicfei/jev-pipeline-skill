name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pytest
      - name: Sync upstream tools
        run: python -m jev_pipeline tools-sync
      - name: Test
        run: python -m pytest tests/ -q

  plugin-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dsh-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Pin npm (runner npm 10.9 hits the 'Exit handler never called' bug)
        run: npm install -g npm@10.8.2
      - name: Install (retry once for flakiness)
        run: npm ci --no-fund --no-audit || npm install --no-fund --no-audit
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
